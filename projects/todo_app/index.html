<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .back-btn{
    position:fixed;
    top:20px;
    left:20px;
    z-index:1000;

    padding:10px 18px;
    background:#00d4ff;
    color:#000;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

.back-btn:hover{
    background:#fff;
    transform:translateY(-2px);
}

  </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <a href="../../index.html" class="back-btn">← Back to Dashboard</a>

  <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg">
    
    <h1 class="text-2xl font-bold text-center mb-4">Todo App</h1>

    <!-- Input -->
    <div class="flex gap-2 mb-4">
      <input
        id="taskInput"
        type="text"
        placeholder="Enter a task..."
        class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
      />
      <button
        onclick="addTask()"
        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"
      >
        Add
      </button>
    </div>

    <!-- Task List -->
    <ul id="taskList" class="space-y-2"></ul>

  </div>

<script>
  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
      const li = document.createElement("li");

      li.className = "flex justify-between items-center bg-gray-50 px-3 py-2 rounded-lg border";

      li.innerHTML = `
        <div class="flex items-center gap-2">
          <input type="checkbox" ${task.done ? "checked" : ""} onchange="toggleTask(${index})"
            class="w-4 h-4"
          />
          <span class="${task.done ? 'line-through text-gray-400' : ''}">
            ${task.text}
          </span>
        </div>

        <button onclick="deleteTask(${index})"
          class="text-red-500 hover:text-red-700 font-bold">
          ✕
        </button>
      `;

      list.appendChild(li);
    });
  }

  function addTask() {
    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    if (!text) return;

    tasks.push({ text, done: false });
    input.value = "";

    saveTasks();
    renderTasks();
  }

  function toggleTask(index) {
    tasks[index].done = !tasks[index].done;
    saveTasks();
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    renderTasks();
  }

  // Initial render
  renderTasks();
</script>

</body>
</html>
