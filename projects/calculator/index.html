<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#141e30,#243b55);
}

.calculator{
    width:320px;
    background:#1f2937;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.display{
    width:100%;
    height:70px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:#fff;
    font-size:2rem;
    text-align:right;
    padding:10px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:60px;
    border:none;
    border-radius:10px;
    font-size:1.3rem;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

.number{
    background:#374151;
    color:white;
}

.operator{
    background:#f59e0b;
    color:white;
}

.equal{
    background:#10b981;
    color:white;
    grid-column:span 2;
}

.clear{
    background:#ef4444;
    color:white;
}

.zero{
    grid-column:span 2;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    z-index:1000;

    padding:10px 18px;
    background:#00d4ff;
    color:#000;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

.back-btn:hover{
    background:#fff;
    transform:translateY(-2px);
}
</style>
</head>
<body>
<a href="../../index.html" class="back-btn">
    ← Back to Dashboard
</a>
<div class="calculator">
    <input type="text" class="display" id="display" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="append('/')">÷</button>
        <button class="operator" onclick="append('*')">×</button>
        <button class="operator" onclick="append('-')">−</button>

        <button class="number" onclick="append('7')">7</button>
        <button class="number" onclick="append('8')">8</button>
        <button class="number" onclick="append('9')">9</button>
        <button class="operator" onclick="append('+')">+</button>

        <button class="number" onclick="append('4')">4</button>
        <button class="number" onclick="append('5')">5</button>
        <button class="number" onclick="append('6')">6</button>
        <button class="operator" onclick="append('%')">%</button>

        <button class="number" onclick="append('1')">1</button>
        <button class="number" onclick="append('2')">2</button>
        <button class="number" onclick="append('3')">3</button>
        <button class="number" onclick="append('.')">.</button>

        <button class="number zero" onclick="append('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
const display = document.getElementById("display");

function append(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function calculate(){
    try{
        display.value = eval(display.value);
    }
    catch{
        display.value = "Error";
    }
}

// Keyboard support
document.addEventListener("keydown", (e) => {
    const allowed = "0123456789+-*/.%";

    if(allowed.includes(e.key)){
        append(e.key);
    }
    else if(e.key === "Enter"){
        calculate();
    }
    else if(e.key === "Backspace"){
        display.value = display.value.slice(0, -1);
    }
    else if(e.key === "Escape"){
        clearDisplay();
    }
});
</script>

</body>
</html>
